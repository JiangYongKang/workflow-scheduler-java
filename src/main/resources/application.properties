# ===== 数据源：H2 文件库，保证进程重启后状态可恢复 =====
spring.datasource.url=jdbc:h2:file:./data/scheduler;AUTO_SERVER=TRUE;WRITE_DELAY=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 每次启动都执行 schema.sql（带 IF NOT EXISTS，幂等）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ===== 调度器配置 =====
# 调度 tick 间隔（毫秒）
scheduler.tick-interval-ms=200
# 全局并发上限
scheduler.quota.global=4
# 默认队列并发上限（请求未指定队列时归入 default）
scheduler.quota.default-queue=2
# 默认租户并发上限（请求未指定租户时归入 default）
scheduler.quota.default-tenant=3
# 调度工作线程数（同时真正在跑的任务数）
scheduler.worker-threads=8

# ===== 内置任务默认重试策略 =====
scheduler.retry.max-attempts=3
scheduler.retry.backoff-base-ms=500
scheduler.retry.backoff-multiplier=2.0

logging.level.com.github.highcumontoa=INFO

# 按队列名单独覆盖（示例）
scheduler.quota.queue.fast=4
scheduler.quota.queue.batch=1
# 按租户名单独覆盖（示例）
scheduler.quota.tenant.tenant-a=2
scheduler.quota.tenant.tenant-b=1
