# ===== DAG 作业调度器配置 =====
# 全局并发上限（同时 RUNNING 的作业总数）
scheduler.global-concurrency=4
# 未单独配置的队列 / 租户默认并发上限
scheduler.default-queue-concurrency=2
scheduler.default-tenant-concurrency=2
# 按队列覆盖：scheduler.queue-concurrency.<队列名>=上限
# scheduler.queue-concurrency.q1=1
# 按租户覆盖：scheduler.tenant-concurrency.<租户名>=上限
# scheduler.tenant-concurrency.t1=1
# 调度循环周期（毫秒）
scheduler.tick-millis=20
# JSON 持久化目录（重启恢复依据）
scheduler.store-dir=data/scheduler
# 默认重试策略：总尝试次数（含首次）与退避毫秒
scheduler.default-max-attempts=1
scheduler.default-backoff-millis=0

spring.jackson.default-property-inclusion=non_null
