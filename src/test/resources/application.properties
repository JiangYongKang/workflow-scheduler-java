# 测试使用独立内存库，避免与本地文件库相互影响
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# 测试中调小间隔与默认值，让断言快速完成
scheduler.tick-interval-ms=50
scheduler.quota.global=3
scheduler.quota.default-queue=3
scheduler.quota.default-tenant=3
scheduler.worker-threads=4
scheduler.retry.max-attempts=3
scheduler.retry.backoff-base-ms=100
scheduler.retry.backoff-multiplier=1.0

logging.level.com.github.highcumontoa=DEBUG
scheduler.quota.queue.hold=1
